<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Device Not Found | MacMo Electronics Lusaka</title>
  <link rel="icon" type="image/png" href="images/macmo-emblem-3d.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .error-page-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: radial-gradient(circle at 50% 20%, rgba(37, 99, 235, 0.15) 0%, #07080c 70%);
      color: #f8fafc;
    }
    .error-card {
      max-width: 520px;
      background: rgba(14, 18, 29, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }
    .error-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      object-fit: contain;
    }
    .error-code {
      font-family: 'Outfit', sans-serif;
      font-size: 4rem;
      font-weight: 800;
      color: #3b82f6;
      line-height: 1;
      margin-bottom: 8px;
    }
    .error-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .error-desc {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .error-btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (min-width: 480px) {
      .error-btn-group {
        flex-direction: row;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="error-page-wrap">
    <div class="error-card">
      <img src="images/macmo-emblem-3d.png" alt="MacMo Electronics" class="error-logo" />
      <div class="error-code">404</div>
      <h1 class="error-title">Device / Page Not Found</h1>
      <p class="error-desc">
        The gadget or page you are looking for may have been updated, relocated, or temporarily sold out at our Silverest Complex store.
      </p>
      <div class="error-btn-group">
        <a href="/" class="btn-primary-tech" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px;">
          <i class="fa-solid fa-store"></i> Browse Tech Catalog
        </a>
        <a href="https://wa.me/260972756767" class="btn-secondary-wa" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px;" target="_blank" rel="noopener">
          <i class="fa-brands fa-whatsapp"></i> WhatsApp Store
        </a>
      </div>
    </div>
  </div>
</body>
</html>
